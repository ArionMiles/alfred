syntax = "proto3";

package alfred.v1;

import "alfred/v1/setup.proto";

option go_package = "github.com/ArionMiles/alfred/gen/alfred/v1;alfredv1";

// ProviderSetupService exposes provider-defined onboarding methods and persistence.
// Saving configuration does not verify authentication or activate inference.
service ProviderSetupService {
  // ListProviderDefinitions returns setup choices in provider-type order.
  rpc ListProviderDefinitions(ListProviderDefinitionsRequest) returns (ListProviderDefinitionsResponse);
  // PrepareProviderSetup returns a form with only safe, non-secret saved values.
  rpc PrepareProviderSetup(PrepareProviderSetupRequest) returns (PrepareProviderSetupResponse);
  // SubmitProviderSetup validates and saves a complete form submission.
  rpc SubmitProviderSetup(SubmitProviderSetupRequest) returns (SubmitProviderSetupResponse);
  // StartProviderAuthorization begins a browser-based provider setup flow.
  rpc StartProviderAuthorization(StartProviderAuthorizationRequest) returns (StartProviderAuthorizationResponse);
  // GetProviderAuthorization reports safe progress for a setup flow.
  rpc GetProviderAuthorization(GetProviderAuthorizationRequest) returns (GetProviderAuthorizationResponse);
  // CancelProviderAuthorization stops a pending setup flow.
  rpc CancelProviderAuthorization(CancelProviderAuthorizationRequest) returns (CancelProviderAuthorizationResponse);
}

enum ProviderSetupMethodKind {
  PROVIDER_SETUP_METHOD_KIND_UNSPECIFIED = 0;
  PROVIDER_SETUP_METHOD_KIND_FORM = 1;
  PROVIDER_SETUP_METHOD_KIND_AUTHORIZATION = 2;
}

// ProviderSetupMethod declares an ordered form or interactive authorization flow.
message ProviderSetupMethod {
  string id = 1;
  string name = 2;
  repeated SetupField fields = 3;
  ProviderSetupMethodKind kind = 4;
}

enum ProviderAuthorizationState {
  PROVIDER_AUTHORIZATION_STATE_UNSPECIFIED = 0;
  PROVIDER_AUTHORIZATION_STATE_PENDING = 1;
  PROVIDER_AUTHORIZATION_STATE_COMPLETED = 2;
  PROVIDER_AUTHORIZATION_STATE_DENIED = 3;
  PROVIDER_AUTHORIZATION_STATE_FAILED = 4;
  PROVIDER_AUTHORIZATION_STATE_CANCELED = 5;
}

message ProviderAuthorization {
  string id = 1;
  ProviderAuthorizationState state = 2;
  string authorization_url = 3;
  string account_label = 4;
  string message = 5;
  ProviderInstance instance = 6;
}

// ProviderDefinition lists the setup methods offered by an implementation.
message ProviderDefinition {
  string type = 1;
  string name = 2;
  repeated ProviderSetupMethod methods = 3;
}

// ProviderSetupForm contains only declared non-secret saved values.
message ProviderSetupForm {
  string type = 1;
  string instance_id = 2;
  ProviderSetupMethod method = 3;
  map<string, string> values = 4;
}

// ProviderInstance contains configured metadata, without credentials or references.
message ProviderInstance {
  string id = 1;
  string type = 2;
  string name = 3;
  bool enabled = 4;
  map<string, string> settings = 5;
}

// ListProviderDefinitionsRequest requests all available setup definitions.
message ListProviderDefinitionsRequest {}

// ListProviderDefinitionsResponse contains definitions, not runtime availability.
message ListProviderDefinitionsResponse {
  repeated ProviderDefinition definitions = 1;
}

// PrepareProviderSetupRequest selects a method for the provider's configured instance.
message PrepareProviderSetupRequest {
  string type = 1;
  string method_id = 2;
}

// PrepareProviderSetupResponse contains the selected form.
message PrepareProviderSetupResponse {
  ProviderSetupForm form = 1;
}

// SubmitProviderSetupRequest replaces the provider's selected-method settings.
// The service owns the configured instance identity, display name, and defaults.
// Values can contain secrets and must never be logged or added to session events.
// Existing API-key connections require reentry of the key on submission.
message SubmitProviderSetupRequest {
  string type = 1;
  string method_id = 2;
  map<string, string> values = 3;
}

// SubmitProviderSetupResponse contains either saved metadata or field errors.
// An instance is configured, not authentication-verified or inference-ready.
message SubmitProviderSetupResponse {
  ProviderInstance instance = 1;
  repeated SetupFieldError field_errors = 2;
}

message StartProviderAuthorizationRequest {
  string type = 1;
  string method_id = 2;
}

message StartProviderAuthorizationResponse {
  ProviderAuthorization authorization = 1;
}

message GetProviderAuthorizationRequest {
  string authorization_id = 1;
}

message GetProviderAuthorizationResponse {
  ProviderAuthorization authorization = 1;
}

message CancelProviderAuthorizationRequest {
  string authorization_id = 1;
}

message CancelProviderAuthorizationResponse {
  ProviderAuthorization authorization = 1;
}
