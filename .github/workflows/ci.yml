name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: go-task/setup-task@v2.2.0
        with:
          version: 3.x
      - run: task ci:quality

  test-build:
    name: Tests and packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: go-task/setup-task@v2.2.0
        with:
          version: 3.x
      - name: Install Shell runtime
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: task test
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: v2.20.0
          args: release --snapshot --clean --skip=publish
      - name: Test container deployment
        run: task test:container
