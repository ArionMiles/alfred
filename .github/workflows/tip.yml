name: Tip

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ inputs.version || 'tip' }}
  cancel-in-progress: ${{ inputs.version == '' }}

jobs:
  image:
    name: Publish daemon image
    if: >-
      inputs.version != '' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Select image and build version
        id: build
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          printf 'image=ghcr.io/%s\n' "$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          version="$RELEASE_VERSION"
          if test -z "$version"; then version="tip-$(printf '%.12s' "$COMMIT")"; fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: ${{ steps.build.outputs.image }}
          tags: |
            type=raw,value=${{ steps.build.outputs.version }}
            type=raw,value=tip,enable=${{ inputs.version == '' }}
            type=raw,value=latest,enable=${{ inputs.version != '' && !contains(inputs.version, '-') }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
            org.opencontainers.image.description=Extensible personal agent daemon
            org.opencontainers.image.licenses=AGPL-3.0-only
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: VERSION=${{ steps.build.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
