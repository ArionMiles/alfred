version: 2
project_name: alfred

builds:
  - dir: backend
    main: ./cmd/alfred
    binary: alfred
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/ArionMiles/alfred/internal/buildinfo.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

release:
  github:
    owner: ArionMiles
    name: alfred
  prerelease: auto

homebrew_casks:
  - name: alfred
    binaries: [alfred]
    homepage: https://github.com/ArionMiles/alfred
    description: Extensible personal agent with a Go core and background service
    caveats: macOS binaries are not notarized and may require explicit approval before execution.
    repository:
      owner: ArionMiles
      name: homebrew-tap
      token: '{{ .Env.TAP_GITHUB_TOKEN }}'
